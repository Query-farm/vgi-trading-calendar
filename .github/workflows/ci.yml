#
# Unit tests (pytest), lint, and the sqllogictest extension suite
# (test/sql/*.test) run against the vgi-trading-calendar worker through the real signed
# `vgi` DuckDB community extension via a prebuilt standalone `haybarn-unittest`.
# See ci/README.md for the design.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow docker-publish.yml to gate the image on this exact suite before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner, pinned; its haybarn 2.0 community `vgi` extension speaks
  # the worker's VGI protocol (vgi.v3).
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_trading_calendar/ trading_calendar_worker.py

      # Run pydoclint in an isolated tool env (uvx): it needs
      # `docstring-parser-fork`, but vgi-rpc pulls in plain `docstring-parser`,
      # and the two share the `docstring_parser` import namespace -- installed
      # together their file order is nondeterministic and can break the import.
      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_trading_calendar/ trading_calendar_worker.py

  # Metadata-quality gate: build the worker, then run the vgi-lint catalog
  # linter against the live `uv run trading_calendar_worker.py` LOCATION and fail on any
  # finding (info and up). Kept a separate job so the lint score is visible.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Use the project venv's python (populated by `uv sync --frozen` above),
          # NOT `uv run <script>`: the PEP 723 inline-script env caches a stale SDK
          # and emits an out-of-date metadata schema (false schema-mismatch errors).
          location: "${{ github.workspace }}/.venv/bin/python ${{ github.workspace }}/trading_calendar_worker.py"
          fail-on: info

  # test/sql/*.test through DuckDB (the haybarn-unittest runner + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh —
  # the same script `make test-sql` runs.
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Build the worker
        run: uv sync --locked --all-extras
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/.venv/bin/vgi-trading-calendar-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
